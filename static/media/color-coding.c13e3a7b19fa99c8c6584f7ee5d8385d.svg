<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer rounded square -->
  <rect
    x="6"
    y="6"
    width="188"
    height="188"
    rx="24"
    fill="none"
    stroke="currentColor"
    stroke-width="12"
  />

  <!-- Vertical divider -->
  <line
    x1="100"
    y1="6"
    x2="100"
    y2="194"
    stroke="currentColor"
    stroke-width="12"
    stroke-linecap="round"
  />

  <!-- Horizontal divider -->
  <line
    x1="6"
    y1="100"
    x2="194"
    y2="100"
    stroke="currentColor"
    stroke-width="12"
    stroke-linecap="round"
  />
</svg>